<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Agentopia Terminal</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="terminal.css">
</head>
<body>
  <header>
    <strong>Agentopia</strong><span>Terminal</span>
    <nav class="app-nav" aria-label="Agentopia">
      <a href="/">Operations</a><a href="/observatory">Observatory</a><a href="/library">Library</a><a href="/settings">Settings</a><span aria-current="page">Terminal</span>
    </nav>
  </header>
  <section class="terminal-controls" aria-label="Terminal controls">
    <span id="service-state" role="status">Loading panes…</span>
    <button id="launch" type="button">New terminal</button>
    <button id="refresh" type="button">Refresh panes &amp; work</button>
  </section>
  <main>
    <div id="tabs" role="tablist" aria-label="Terminal tabs"></div>
    <section id="toolbar" aria-label="Terminal layout">
      <label>Show alongside <select id="split-pane" aria-label="Pane to show alongside"></select></label>
      <button id="split-horizontal" type="button">Split horizontal</button>
      <button id="split-vertical" type="button">Split vertical</button>
      <button id="unsplit" type="button">Unsplit</button>
    </section>
    <p id="notice" role="status"></p>
    <section id="panes" aria-label="Terminal panes"></section>
  </main>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
